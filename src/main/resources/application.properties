# ==========================================
# NeoDeploy Application Configuration
# ==========================================

# Application Name
spring.application.name=neodeploy

# Server Port (changed to 9090 because 8080 is used by Oracle)
server.port=9090

# ==========================================
# Database Configuration (H2 - In Memory)
# ==========================================
# Using H2 for easy development - no MySQL setup needed!
# H2 Console available at: http://localhost:8080/h2-console

spring.datasource.url=jdbc:h2:mem:neodeploydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging database)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ==========================================
# Production MySQL Configuration (uncomment when ready)
# ==========================================
# spring.datasource.url=jdbc:mysql://localhost:3306/neodeploydb
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ==========================================
# Spring Actuator (Health Checks)
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# App Info (shown in /actuator/info)
info.app.name=NeoDeploy
info.app.description=CI/CD DevOps Pipeline Demo
info.app.version=1.0.0

# ==========================================
# Logging
# ==========================================
logging.level.com.neodeploy=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
