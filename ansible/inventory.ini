# ==========================================
# Ansible Inventory File
# ==========================================
#
# WHAT IS THIS?
# Tells Ansible which servers to manage.
# For now, we use localhost (your own PC).
#
# In production, you'd list actual servers:
# [webservers]
# server1.company.com
# 192.168.1.100
# ==========================================

[webservers]
# For WSL2, use localhost
localhost ansible_connection=local

[database]
localhost ansible_connection=local

# Group variables
[webservers:vars]
ansible_python_interpreter=/usr/bin/python3

[all:vars]
# Default variables for all hosts
app_environment=development
